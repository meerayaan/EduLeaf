<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>EduLeaf Admin 2.1</title><style>
*{box-sizing:border-box} [hidden]{display:none!important}body{margin:0;background:#0c0d0f;color:#eee;font:15px system-ui;color-scheme:dark}header,main,footer{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}h1,h2,h3,p{margin:0 0 12px}h1,strong{color:#d5b46b}small,footer{color:#a0a0a0}article,section.panel{background:#15171b;border:1px solid #303238;border-radius:16px;padding:18px;margin:12px 0;overflow-wrap:anywhere}input,select,textarea,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #41434a;background:#101115;color:#eee;max-width:100%}button{background:#d5b46b;color:#15120b;font-weight:650;cursor:pointer}button:disabled{opacity:.5}button.danger{background:#54252a;color:#ffd0d0}button.secondary{background:#202229;color:#e4c98c}label{display:block;margin:10px 0}label input:not([type=checkbox]),label select,label textarea{display:block;width:100%;margin-top:5px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.stats article{margin:0}.stats strong{display:block;font-size:25px}#login{max-width:420px;margin:8vh auto}#message{white-space:pre-wrap;color:#e4c98c;margin:14px 0}dialog{background:#15171b;color:#eee;border:1px solid #555;border-radius:15px;width:min(94%,600px);max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}footer{text-align:center} .tag{color:#e4c98c;text-transform:uppercase;font-size:12px;letter-spacing:1px}*{-webkit-tap-highlight-color:transparent}button{transition:transform .18s}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid #d5b46b}@media(prefers-reduced-motion:reduce){button{transition:none}}</style><meta name="robots" content="noindex,nofollow"></head><body><header><div><h1>EduLeaf</h1><small>Administration · 2.1</small></div><button id="logout" hidden>Logout</button></header><main><section id="login" class="panel"><h2>Admin access</h2><form id="loginForm"><label>Admin secret<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p id="loginMessage" role="status"></p></section><section id="dashboard" hidden><h2>Material management</h2><div id="stats" class="stats"></div><div class="row" style="margin-top:16px"><button id="upload" class="secondary">Upload material</button><button id="manageNotices" class="secondary">Notifications</button><button id="activity" class="secondary">Activity log</button><button id="refresh" class="secondary">Refresh</button></div><div class="row" style="margin-top:12px"><input id="search" type="search" placeholder="Search materials" aria-label="Search materials"><select id="filter" aria-label="Status"><option value="">All statuses</option><option>pending</option><option>approved</option><option>rejected</option><option>unpublished</option><option>deleting</option></select><button id="apply">Search</button></div><section class="panel"><h3>Community uploads</h3><p id="uploadState">Checking…</p><button id="toggleUploads" disabled>Change setting</button></section><section class="panel"><h3>Bulk management</h3><div class="row"><button id="selectAll" class="secondary">Select page</button><button id="clearAll" class="secondary">Clear selection</button><span id="selectedCount">0 selected</span></div><div class="row" style="margin-top:10px"><select id="bulkAction" aria-label="Bulk action"><option value="approve">Approve</option><option value="reject">Reject</option><option value="unpublish">Unpublish</option><option value="republish">Republish</option><option value="restore">Restore</option><option value="delete">Permanently delete</option></select><button id="bulkRun" disabled>Apply to selected</button></div><small>Selection applies to this page only. Ineligible items are skipped.</small></section><p id="message" role="status"></p><div id="items"></div><div class="row"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></section></main><dialog id="editor"><h2 id="editorTitle"></h2><form id="editForm"><div id="fields"></div><p id="editMessage" role="status"></p><div class="row"><button id="save">Save</button><button type="button" id="cancel" class="secondary">Cancel</button></div></form></dialog><footer>EduLeaf · Developed by Ayan Altaf Mir</footer><script>
'use strict';const $=id=>document.getElementById(id);let secret='',session=0,page=1,count=0,busy=false,courses=null,editAction='',editId;const types=['Study Notes','Previous Year Question Papers','Solved Papers','Important Questions','Other'];const groups={MAJOR:'Major',MINOR:'Minor',MULTIDISCIPLINARY:'MDC',ABILITY:'AEC',SKILL:'SEC',VALUE:'VAC'};const el=(tag,text='',cls='')=>{const n=document.createElement(tag);n.textContent=text;n.className=cls;return n};const btn=(text,fn,cls='secondary')=>{const b=el('button',text,cls);b.type='button';b.onclick=fn;return b};async function api(action,id,body,params={}){const u=new URL('/api/admin',location.origin);u.searchParams.set('action',action);if(id!=null)u.searchParams.set('id',id);for(const [k,v] of Object.entries(params))u.searchParams.set(k,v);const res=await fetch(u,{method:body!==undefined?'POST':'GET',body,headers:{Authorization:'Bearer '+secret},cache:'no-store',credentials:'omit',redirect:'error'});if(!res.ok){let d;try{d=await res.json()}catch{}throw Error(d?.error||'HTTP '+res.status)}return res}async function load(){const s=session;const d=await(await api('list',null,undefined,{page,search:$('search').value,status:$('filter').value})).json();if(s!==session)return;count=d.count; selected.clear(); visible=d.submissions; syncSelection();$('stats').replaceChildren();for(const [k,v] of Object.entries(d.stats)){const a=el('article');a.append(el('small',k==='bytes'?'Stored file size':k),el('strong',k==='bytes'?(v/1048576).toFixed(2)+' MB':String(v)));$('stats').append(a)}$('items').replaceChildren();for(const x of d.submissions)render(x);if(!d.submissions.length)$('items').append(el('p','No materials found'));$('page').textContent=`Page ${page} / ${Math.max(1,Math.ceil(count/25))}`;$('prev').disabled=page<=1;$('next').disabled=page*25>=count}async function run(fn){if(busy)return;busy=true;const s=session;try{await fn()}catch(e){if(s===session)$('message').textContent=e.message}finally{busy=false}}function render(x){const a=el('article'),status=x.deleting?'deleting':x.unpublished?'unpublished':x.status;a.append(el('p',status,'tag'),el('h3',x.subject),el('p',`${x.batch} · Semester ${x.semester} · ${x.category}`),el('p',x.material_type),el('p',x.file_name),el('p',x.description||''),el('small',`#${x.id} · ${x.contributor||'Anonymous'}`));const row=el('div','','row');const act=(name,label,cls)=>row.append(btn(label,()=>run(async()=>{if(!confirm(`${label} #${x.id}?`))return;const d=await(await api(name,x.id,null)).json();await load();$('message').textContent=d.warning||label+' completed';}),cls));if(!x.deleting){row.append(btn('Download',()=>run(async()=>{const s=session,b=await(await api('download',x.id)).blob();if(s!==session)return;const u=URL.createObjectURL(b),l=el('a');l.href=u;l.download=x.file_name;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)})),btn('Edit',()=>run(()=>editor('edit',x))),btn('Replace',()=>run(()=>editor('replace',x))));if(status==='pending'){act('approve','Approve');act('reject','Reject','danger')}if(status==='approved')act('unpublish','Unpublish');if(status==='unpublished')act('republish','Republish');if(status==='rejected')act('restore','Restore to pending')}act('delete',x.deleting?'Retry permanent deletion':'Permanently delete','danger');const check=el('input');check.type='checkbox';check.setAttribute('aria-label','Select submission '+x.id);check.dataset.selection=String(x.id);check.onchange=()=>{if(check.checked)selected.add(x.id);else selected.delete(x.id);syncSelection()};const label=el('label','Select #'+x.id+' ');label.prepend(check);a.prepend(label);a.append(row);$('items').append(a)}function field(name,label,tag='input',value='',options=[]){const l=el('label',label),n=el(tag);n.name=name;if(tag==='select'){for(const v of options){const o=el('option',v);o.value=v;n.append(o)}}n.value=value;l.append(n);$('fields').append(l);return n}async function editor(action,x={}){const s=session;editAction=action;editId=x.id;$('fields').replaceChildren();$('editMessage').textContent='';$('editorTitle').textContent=action==='upload'?'Upload material':action==='edit'?'Edit details':'Replace file (returns to pending)';if(action!=='replace'){if(!courses){const r=await fetch('/courses.json');if(!r.ok)throw Error('Catalogue unavailable');courses=await r.json()}if(s!==session)return;const b=field('batch','Batch','select',x.batch||'2026',['2024','2025','2026']),sem=field('semester','Semester','select',String(x.semester||1),['1','2','3','4','5','6','7','8']),cat=field('category','Category','select',x.category||'Major',['Major','Minor','MDC','AEC','SEC','VAC','Other']),sub=field('subject','Subject','select');function update(){sub.replaceChildren();const vals=new Set(courses.filter(c=>c.batch===b.value&&Number(c.semester.startsWith('Ist')?'1':c.semester.match(/^\d+/)?.[0])===Number(sem.value)&&(groups[c.category.split(' ')[0]]||'Other')===cat.value).map(c=>c.name+' | '+c.code));for(const v of [...vals].sort()){const o=el('option',v);o.value=v;sub.append(o)}}b.onchange=sem.onchange=cat.onchange=update;update();if(x.subject)sub.value=x.subject;sub.required=true;field('type','Material type','select',x.material_type||types[0],types);field('details','Description','textarea',x.description||'').maxLength=1000;field('contributor','Contributor','input',x.contributor||'').maxLength=100;if(action==='edit')field('file_name','Filename','input',x.file_name).required=true}if(action!=='edit'){const f=field('file','File (max 10 MB)');f.type='file';f.accept='.pdf,.jpg,.jpeg,.png,.docx';f.required=true;const p=field('permission','I have permission to share this file');p.type='checkbox';p.required=true;p.value='on'}$('editor').showModal()}$('editForm').onsubmit=async ev=>{ev.preventDefault();if(busy)return;busy=true;const s=session;$('save').disabled=true;try{const d=await(await api(editAction,editId,new FormData(ev.target))).json();if(s!==session)return;$('editor').close();await load();$('message').textContent=d.warning||'Saved successfully'}catch(e){if(s===session)$('editMessage').textContent=e.message}finally{busy=false;$('save').disabled=false}};$('cancel').onclick=()=>$('editor').close();$('loginForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;secret=$('password').value;$('password').value='';try{await load();await loadSettings();$('login').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;$('loginMessage').textContent=''}catch(e){secret='';$('loginMessage').textContent=e.message}finally{busy=false}};function logout(){session++;secret='';selected.clear();visible=[];syncSelection();$('toggleUploads').disabled=true;$('editor').close();$('fields').replaceChildren();$('items').replaceChildren();$('stats').replaceChildren();$('message').textContent='';$('dashboard').hidden=true;$('logout').hidden=true;$('login').hidden=false;page=1}$('logout').onclick=logout;window.addEventListener('pagehide',logout);$('refresh').onclick=()=>run(async()=>{await load();await loadSettings()});$('apply').onclick=()=>run(async()=>{page=1;await load()});$('prev').onclick=()=>run(async()=>{if(page>1)page--;await load()});$('next').onclick=()=>run(async()=>{if(page*25<count)page++;await load()});$('upload').onclick=()=>run(()=>editor('upload'));$('activity').onclick=()=>run(async()=>{const d=await(await api('activity')).json();$('message').textContent=d.activity.map(x=>`${x.created_at} · ${x.action} · #${x.submission_id} ${x.details||''}`).join('\n')||'No activity yet'});

const selected=new Set();let visible=[],uploadSetting=null;
function syncSelection(){ $('selectedCount').textContent=selected.size+' selected';$('bulkRun').disabled=!selected.size;for(const c of $('items').querySelectorAll('[data-selection]'))c.checked=selected.has(Number(c.dataset.selection)); }
$('selectAll').onclick=()=>{if(busy)return;visible.forEach(x=>selected.add(x.id));syncSelection()};
$('clearAll').onclick=()=>{if(busy)return;selected.clear();syncSelection()};
async function loadSettings(){const s=session;$('toggleUploads').disabled=true;try{const d=await(await api('settings')).json();if(s!==session)return;uploadSetting=d.enabled;$('uploadState').textContent=d.environmentEnabled?(d.enabled?'ON — public uploads allowed':'OFF — public uploads paused'):'OFF — Cloudflare emergency switch disabled (dashboard setting '+(d.enabled?'ON':'OFF')+')';$('toggleUploads').textContent=d.enabled?'Turn public uploads OFF':'Turn public uploads ON';$('toggleUploads').disabled=false}catch(e){if(s===session)$('uploadState').textContent='Setting unavailable: '+e.message}}
$('toggleUploads').onclick=()=>run(async()=>{const s=session;const next=!uploadSetting;if(!confirm('Turn public uploads '+(next?'ON':'OFF')+'?'))return;await api('settings',null,null,{enabled:String(next)});if(s!==session)return;await loadSettings();});
$('bulkRun').onclick=()=>run(async()=>{const s=session,action=$('bulkAction').value,items=visible.filter(x=>selected.has(x.id));if(!items.length)return;const status=x=>x.deleting?'deleting':x.unpublished?'unpublished':x.status;const allowed={approve:'pending',reject:'pending',unpublish:'approved',republish:'unpublished',restore:'rejected'};const eligible=items.filter(x=>action==='delete'||status(x)===allowed[action]);if(!eligible.length){$('message').textContent='No eligible files selected';return}if(!confirm(action.toUpperCase()+' '+eligible.length+' file(s)?\n'+eligible.map(x=>'#'+x.id+' '+x.file_name).join('\n')+(action==='delete'?'\nThis cannot be undone.':'')))return;if(action==='delete'&&prompt('Type DELETE to permanently remove these files')!=='DELETE')return;let ok=0,failed=[];for(const x of eligible){if(s!==session)return;try{await api(action,x.id,null);ok++}catch(e){failed.push('#'+x.id+': '+e.message)}}if(s!==session)return;const report=`${ok} succeeded · ${failed.length} failed · ${items.length-eligible.length} skipped`+(failed.length?'\n'+failed.join('\n'):'');try{await load();if(!visible.length&&page>1){page--;await load()}}catch(e){if(s===session)$('message').textContent=report+'\nRefresh failed: '+e.message;return}if(s===session)$('message').textContent=report});

window.addEventListener('DOMContentLoaded',()=>{const dlg=$('noticeAdmin'),f=$('noticeForm'),status=$('noticeAdminStatus');async function refreshNotices(){const current=session;const d=await(await api('notifications')).json();if(current!==session)return;const list=$('noticeAdminList');list.replaceChildren();for(const x of d.notifications){const a=el('article');a.append(el('strong',x.title),el('p',x.body),el('small',x.kind+' · expires '+x.expires_at));if(x.submission_id==null)a.append(btn('Edit',()=>{f.elements.id.value=x.id;f.elements.kind.value=x.kind;f.elements.title.value=x.title;f.elements.body.value=x.body;f.elements.days.value=Math.max(1,Math.min(365,Math.ceil((Date.parse(x.expires_at.replace(' ','T')+'Z')-Date.now())/86400000)));f.scrollIntoView()}));a.append(btn('Delete',async()=>{if(!confirm('Delete notification?'))return;try{const b=new FormData();b.set('op','delete');b.set('id',x.id);await api('notifications',null,b);await refreshNotices()}catch(e){status.textContent=e.message}},'danger'));list.append(a)}}$('manageNotices').onclick=async()=>{f.reset();status.textContent='';dlg.showModal();try{await refreshNotices()}catch(e){status.textContent=e.message}};$('noticeAdminClose').onclick=()=>dlg.close();f.onsubmit=async e=>{e.preventDefault();const b=new FormData(f);b.set('op',b.get('id')?'edit':'publish');try{await api('notifications',null,b);f.reset();status.textContent='Saved';await refreshNotices()}catch(e){status.textContent=e.message}};});
</script><dialog id="noticeAdmin"><h2>Notifications</h2><form id="noticeForm"><input type="hidden" name="id"><label>Type<select name="kind"><option>announcement</option><option>feature</option><option>syllabus</option><option>maintenance</option></select></label><label>Title<input name="title" maxlength="120" required></label><label>Message<textarea name="body" maxlength="1000" required></textarea></label><label>Maintenance duration (days)<input name="days" type="number" min="1" max="365" value="7" required></label><button>Publish / save</button> <button type="reset" class="secondary">New</button></form><p id="noticeAdminStatus" role="status"></p><div id="noticeAdminList"></div><button id="noticeAdminClose" class="secondary">Close</button></dialog></body></html>
