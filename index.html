'use strict';const portal='https://egov.uok.edu.in/eservices/syllabus/prelogin/course.aspx?coursetype=UGNEP';
const main=document.getElementById('content');const btn=(label,url,external=false)=>`<a class="btn outline" href="${url}" ${external?'target="_blank" rel="noopener noreferrer"':''}>${label}</a>`;const card=(title,desc,action='',status='')=>`<article class="card">${status?`<span class="status">${status}</span>`:''}<h3>${title}</h3><p>${desc}</p>${action}</article>`;const grid=x=>`<div class="grid">${x}</div>`;const crumb=x=>`<div class="crumb"><a href="#home">Home</a> / ${x}</div>`;const ku='<a href="#ug">UG</a> / <a href="#ku">KU</a>';const categories=['Major','Minor','MDC','AEC','SEC','VAC'];let generation=0;

let data=[],error=false,ready=false;
const email='ayanaltafmir@gmail.com', repo='https://github.com/meerayaan/EduLeaf';
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
const key=x=>JSON.stringify([x.batch,x.semester,x.category,x.code,x.name,x.link]);let savedKeys=read('edu-saved',[]);if(!Array.isArray(savedKeys))savedKeys=[];let recent=read('edu-recent',[]);if(!Array.isArray(recent))recent=[];
let timer;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(timer);timer=setTimeout(()=>e.hidden=true,2200)}
function subjectURL(x){return '#subject/'+x.batch+'/'+sem(x)+'/'+group(x)+'/'+data.indexOf(x)}
function pretty(v){return String(v).toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase()).replace(/\b(Dbms|Oops|Ict|Ai|Mdc|Aec|Sec|Vac|Ug|It)\b/g,m=>m.toUpperCase())}
function courseCard(x){const i=data.indexOf(x),has=savedKeys.includes(key(x));const [page,b,n,c,kind]=location.hash.slice(1).split('/');const mode=page==='category'&&['notes','pyq'].includes(kind)?kind:'syllabus';return `<article class="card course"><h3>${esc(pretty(x.name))}</h3><p>${esc(x.code)} · ${esc(x.remarks)}<br>${esc(x.category)}</p>${btn(mode==='notes'?'View notes →':mode==='pyq'?'View papers →':'View resources →',subjectURL(x)+(mode==='syllabus'?'':'/'+mode))}<button class="iconbtn bookmark" data-save="${i}" aria-label="${has?'Remove saved subject':'Save subject'}" aria-pressed="${has}">${has?'★':'☆'}</button></article>`}
function mail(subject,body=''){return 'mailto:'+email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const group=x=>({MAJOR:'Major',MINOR:'Minor',MULTIDISCIPLINARY:'MDC',ABILITY:'AEC',SKILL:'SEC',VALUE:'VAC'}[x.category.split(' ')[0]]||'Other');
const sem=x=>x.semester.startsWith('Ist')?'1':x.semester.match(/^\d+/)?.[0];
const batches=['2026','2025','2024'];
const navTrail=[{hash:location.hash||'#home',y:0}];let restoreY=0;
function setupUpload(id){const f=document.getElementById('community');const old=f.elements.subject;const sel=document.createElement('select');sel.name='subject';sel.required=true;old.replaceWith(sel);const refresh=()=>{const matches=data.filter(x=>x.batch===f.elements.batch.value&&sem(x)===f.elements.semester.value&&group(x)===f.elements.category.value);sel.replaceChildren(new Option('Select subject',''));for(const x of matches){const opt=new Option(pretty(x.name)+' — '+x.code,x.name+' | '+x.code);sel.add(opt);if(data[Number(id)]===x)sel.value=opt.value;} };for(const k of ['batch','semester','category'])f.elements[k].addEventListener('change',refresh);refresh();const submit=f.querySelector('button[type=submit]');submit.textContent='Submit for review';submit.insertAdjacentHTML('beforebegin','<label>Contributor name (optional)<input name="contributor" maxlength="100"></label><label>Choose file (max 10 MB)<input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.docx" required></label><p role="status" id="uploadStatus"></p>');f.querySelector('input[type=checkbox]').name='permission';f.onsubmit=async e=>{e.preventDefault();const status=f.querySelector('#uploadStatus');const file=f.elements.file.files[0];if(!file||file.size>10*1024*1024){status.textContent='Choose a file up to 10 MB.';return;}submit.disabled=true;status.textContent='Uploading…';try{const r=await fetch('/api/upload',{method:'POST',body:new FormData(f)});const result=await r.json();if(!r.ok||!result.ok)throw Error(result.error||'Upload failed');status.textContent='Submitted for review. Reference: '+result.id;f.reset();refresh();}catch(e){status.textContent='Submission failed: '+e.message;}finally{submit.disabled=false;}};}

else if(page==='subject'){const x=data[Number(id)];if(!x||x.batch!==b||sem(x)!==n||group(x)!==c)html=crumb(bc)+loading+'<p>Course unavailable.</p>'+btn('Back to subjects',cat);else html=crumb(bc+' / <a href="'+cat+'">'+esc(c)+'</a>')+'<h1>'+esc(x.name)+'</h1><p class="lead">'+esc(x.code)+' · '+esc(x.remarks)+'</p><p>'+esc(x.category)+'</p>'+grid(card('Syllabus','University syllabus PDF','<div id="pdf">Checking local PDF…</div>')+card('Study notes','Materials will be added.','','Coming soon')+card('Previous year papers','Materials will be added.','','Coming soon'));}

else html='<div class="hero"><div class="eyebrow">Learn. Grow. Succeed.</div><h1>Knowledge for every step of your journey.</h1><p>An independent academic library, built to make educational resources easier to find and access.</p><a class="btn" href="#ug">Explore UG resources →</a></div><h2>Explore education</h2>'+grid(card('UG Education','University syllabuses and academic resources.',btn('Explore →','#ug'))+card('School Education','Class-wise resources.','','Coming soon')+card('More resources','Study notes and question papers.','','Coming soon'))+'<h2>Featured collection</h2>'+grid(card('University of Kashmir','Explore undergraduate NEP syllabus resources.',btn('View collection →','#ku')));
if(!page||page==='home'){const pref=read('edu-pref',null);html+='<h2>Your academic space</h2>'+grid(card('My Semester','Quick access to your semester.',btn('Open →',pref?'#semester/'+pref.batch+'/'+pref.semester:'#my'))+card('Saved subjects','Keep your courses handy.',btn('Open →','#saved'))+card('Search syllabus','Find any subject or course code.',btn('Search →','#search')))+'<h2>EduLeaf in numbers</h2><div class="stats">'+[['Syllabus records',ready?data.length:'…'],['Academic batches',3],['Semesters',8],['Unique PDF links',ready?new Set(data.map(x=>x.link)).size:'…']].map(([a,v])=>card(typeof v==='number'?v.toLocaleString('en-IN'):String(v),a)).join('')+'</div>'}if(page==='subject'&&resource!=='syllabus'&&data[Number(id)]&&data[Number(id)].batch===b&&sem(data[Number(id)])===n&&group(data[Number(id)])===c){const x=data[Number(id)];html=crumb(bc+' / <a href="'+cat+'">'+esc(c)+'</a>')+'<h1>'+esc(pretty(x.name))+'</h1><p class="lead">'+esc(x.code)+'</p>'+grid(card(resource==='notes'?'Study Notes':'Previous Year Papers','Approved study materials.','<div id="publishedMaterials" role="status">Loading materials…</div>'+btn('Request material','#request/'+b+'/'+n+'/'+c+'/'+id)+' '+btn('Contribute','#upload/'+b+'/'+n+'/'+c+'/'+id)))}main.innerHTML=html;document.body.classList.toggle('internal',!!page&&page!=='home');if(page&&page!=='home'){const back=document.createElement('button');back.className='iconbtn backbtn';back.textContent='← Back';back.onclick=()=>{if(navTrail.length>1){navTrail.pop();const prev=navTrail.pop();location.hash=prev.hash;restoreY=prev.y;}else location.hash='#home';};main.prepend(back);}if(page==='upload')setupUpload(id);
if(page==='subject' && resource!=='syllabus'){
 const el=document.getElementById('publishedMaterials');
 const x=data[Number(id)];
 if(el && x){
 (async()=>{
 try{
 const params=new URLSearchParams({
 batch:b,semester:n,category:c,
 subject:x.name+' | '+x.code,
 type:resource==='notes'?'Study Notes':'Previous Year Question Papers'
 });
 const r=await fetch('/api/materials?'+params);
 const result=await r.json();
 if(!r.ok || !result.ok || !Array.isArray(result.materials))throw Error();
 if(token!==generation)return;
 el.replaceChildren();
 if(!result.materials.length){
 el.textContent='No materials published yet.';
 return;
 }
 for(const m of result.materials){
 if(!Number.isSafeInteger(m.id)||m.id<1)continue;
 const item=document.createElement('div');
 item.className='card';
 const title=document.createElement('h3');
 title.textContent=m.file_name;
 const info=document.createElement('p');
 info.textContent='Approved material · '+(m.file_size/1024).toFixed(1)+' KB';
 const link=document.createElement('a');
 link.className='btn';
 link.href='/api/materials?action=download&id='+m.id;
 link.textContent='Download file';
 item.append(title,info,link);
 el.append(item);
 }
 }catch{
 if(token===generation)el.textContent='Unable to load materials. Please refresh to retry.';
 }
 })();
 }
}

if(page==='subject'&&data[Number(id)]&&document.getElementById('pdf')){const x=data[Number(id)];recent=[key(x),...recent.filter(k=>k!==key(x))].slice(0,30);write('edu-recent',recent);main.insertAdjacentHTML('beforeend','<div class="actions"><button class="iconbtn" data-save="'+Number(id)+'" aria-pressed="'+savedKeys.includes(key(x))+'">'+(savedKeys.includes(key(x))?'★ Saved':'☆ Save subject')+'</button>'+btn('Request study material','#request/'+b+'/'+n+'/'+c+'/'+id)+btn('Support by uploading','#upload/'+b+'/'+n+'/'+c+'/'+id)+'</div>')}
if(page==='request')document.getElementById('community').onsubmit=e=>{e.preventDefault();const fields=[...new FormData(e.target)].map(([k,v])=>k+': '+v).join('\n');location.href=mail(page==='upload'?'EduLeaf contribution':'EduLeaf material request',fields+(page==='upload'?'\nPlease attach your file before sending.':''))};

if(['saved','recent','search'].includes(page)){const input=document.getElementById('search');const render=()=>{const q=input.value.trim().toLowerCase();const pool=page==='saved'?data.filter(x=>savedKeys.includes(key(x))):page==='recent'?recent.map(k=>data.find(x=>key(x)===k)).filter(Boolean):data;const found=pool.filter(x=>(x.name+' '+x.code+' '+x.batch+' '+x.semester).toLowerCase().includes(q));document.getElementById('count').textContent=found.length+' results'+(found.length>100?' · Showing first 100; refine search':'');document.getElementById('results').innerHTML=found.slice(0,100).map(courseCard).join('')||'<p>No matching courses.</p>'};input.oninput=render;render()}
const animateCards=()=>main.querySelectorAll('.card').forEach((el,i)=>el.style.setProperty('--delay',Math.min(i,7)*45+'ms'));animateCards();main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter');document.title=(main.querySelector('h1')?.textContent||'Learn. Grow. Succeed.')+' | EduLeaf';window.scrollTo(0,restoreY);restoreY=0;
if(page==='category'){const search=document.getElementById('search');const render=()=>{const q=search.value.trim().toLowerCase();const found=list.filter(x=>[x.name,x.code,x.category].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=found.length+' of '+list.length+' courses';document.getElementById('results').innerHTML=found.map(courseCard).join('')||'<p>No matching courses.</p>';animateCards()};search.oninput=render;render()}
if(page==='subject'&&document.getElementById('pdf')){const x=data[Number(id)];(async()=>{let local=false;try{const r=await fetch(x.pdf,{method:'HEAD'});local=r.ok&&/application\/pdf/i.test(r.headers.get('content-type')||'')}catch{}if(token!==generation)return;const el=document.getElementById('pdf');el.innerHTML=local?btn('View PDF ↗',esc(x.pdf),true)+' <a class="btn outline" download href="'+esc(x.pdf)+'">Download PDF</a>':'<p>Local PDF not uploaded yet.</p>'+btn('Open official PDF ↗',esc(x.link),true)})()}}
fetch('courses.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{if(!Array.isArray(v))throw Error();data=v;ready=true;route()}).catch(()=>{error=true;route()});
const theme=document.getElementById('theme');function applyTheme(v){document.documentElement.dataset.theme=v;theme.textContent=v==='dark'?'☀':'◐';theme.setAttribute('aria-label',v==='dark'?'Switch to light mode':'Switch to dark mode')}let saved;try{saved=localStorage.getItem('eduleaf-theme')}catch(e){}applyTheme('dark');theme.onclick=()=>{const v=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(v);try{localStorage.setItem('eduleaf-theme',v)}catch(e){}};document.getElementById('year').textContent=new Date().getFullYear();const menu=document.getElementById('menu'),toggle=document.getElementById('menuToggle');const icons={home:'M3 10l9-7 9 7v10H3z M9 20v-7h6v7',education:'M2 9l10-5 10 5-10 5z M6 11v6l6 3 6-3v-6',calendar:'M4 5h16v16H4z M4 10h16 M8 3v4 M16 3v4',search:'M15 15l6 6 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',bookmark:'M6 3h12v18l-6-4-6 4z',history:'M3 12a9 9 0 1 0 3-7 M3 3v6h6 M12 7v5l4 2',book:'M3 4h7l2 2 2-2h7v15h-7l-2 2-2-2H3z M12 6v15',upload:'M12 16V3 M7 8l5-5 5 5 M4 15v6h16v-6',flag:'M5 22V3h14l-3 5 3 5H5',share:'M12 16V3 M7 8l5-5 5 5 M4 12v9h16v-9',mail:'M3 5h18v14H3z M3 6l9 7 9-7',info:'M12 11v6 M12 7h.01 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',code:'M8 6l-6 6 6 6 M16 6l6 6-6 6 M14 3l-4 18',repo:'M4 4h16v16H4z M8 4v16 M12 8h5 M12 12h5',theme:'M12 3v2 M12 19v2 M3 12h2 M19 12h2 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0'};const mi=k=>'<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+icons[k]+'"/></svg>';const groups=[['Explore',[['Home','#home','home'],['UG Education','#ug','education'],['My Semester','#my','calendar'],['Search Syllabus','#search','search'],['Saved Subjects','#saved','bookmark'],['Recently Viewed','#recent','history']]],['Community',[['Request Study Material','#request','book'],['Support by Uploading','#upload','upload'],['Report an Issue',mail('EduLeaf issue'),'flag'],['Share EduLeaf',null,'share','share']]]];menu.innerHTML='<div class="menu-head"><span>EduLeaf</span><button id="menuClose" aria-label="Close menu">×</button></div><div class="menu-scroll">'+groups.map(([h,items])=>'<section class="menu-group"><small>'+h.toUpperCase()+'</small>'+items.map(([t,u,k,id])=>{const content=mi(k)+'<span>'+t+'</span><span class="menu-chevron" aria-hidden="true">›</span>';return u?'<a href="'+esc(u)+'">'+content+'</a>':'<button id="'+id+'">'+content+'</button>'}).join('')+'</section>').join('')+'</div><div class="menu-foot">EduLeaf · V1.0</div>';const shade=document.getElementById('menuShade');function closeMenu(){const wasOpen=!menu.hidden;menu.hidden=true;shade.hidden=true;document.body.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false');if(wasOpen)toggle.focus({preventScroll:true})}toggle.setAttribute('aria-controls','menu');toggle.onclick=()=>{if(!menu.hidden){closeMenu();return}menu.hidden=false;shade.hidden=false;document.body.classList.add('menu-open');toggle.setAttribute('aria-expanded','true');document.getElementById('menuClose').focus()};document.getElementById('menuClose').onclick=closeMenu;document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!toggle.contains(e.target))closeMenu();const b=e.target.closest('[data-save]');if(b){const x=data[Number(b.dataset.save)];if(!x)return;const k=key(x),has=savedKeys.includes(k);savedKeys=has?savedKeys.filter(v=>v!==k):[...savedKeys,k];const ok=write('edu-saved',savedKeys);b.textContent=b.classList.contains('bookmark')?(has?'☆':'★'):(has?'☆ Save subject':'★ Saved');b.setAttribute('aria-label',has?'Save subject':'Remove saved subject');b.setAttribute('aria-pressed',String(!has));toast(ok?(has?'Subject removed':'Subject saved'):'Browser storage unavailable');if(location.hash==='#saved')route()}});menu.addEventListener('click',e=>{if(e.target.closest('a'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'EduLeaf',url:location.origin});else{await navigator.clipboard.writeText(location.origin);toast('Website link copied')}}catch{}};window.addEventListener('scroll',()=>{if(navTrail.length)navTrail[navTrail.length-1].y=window.scrollY},{passive:true});window.addEventListener('hashchange',()=>{closeMenu();navTrail.push({hash:location.hash||'#home',y:0});route()});route();
