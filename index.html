<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146b48"><title>EduLeaf | Learn. Grow. Succeed.</title><style>
:root{color-scheme:light;--bg:#f7faf8;--surface:#fff;--ink:#17332a;--muted:#586c63;--line:#dce7df;--green:#146b48;--soft:#e7f4eb}html[data-theme=dark]{color-scheme:dark;--bg:#101b16;--surface:#182820;--ink:#e8f5ec;--muted:#afc5b7;--line:#354b3e;--green:#8de0ad;--soft:#203b2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}a{color:var(--green);text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #49a86f;outline-offset:3px}.wrap{width:min(1120px,92%);margin:auto}header,footer{background:var(--surface);border-bottom:1px solid var(--line)}nav{display:flex;align-items:center;justify-content:space-between;min-height:76px;gap:12px}.brand{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:800;color:var(--ink);letter-spacing:-1px}.brand svg{width:40px;height:40px}.navlinks{display:flex;align-items:center;gap:20px}.iconbtn,input,select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px}.hero{margin:30px 0 42px;padding:clamp(28px,6vw,76px);background:#104b35;color:white;border-radius:28px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;text-transform:uppercase;color:var(--green)}.hero .eyebrow{color:#a7e7bd}h1,h2,h3,p{margin:0}h1{font-size:clamp(32px,6vw,60px);line-height:1.1;letter-spacing:-1.5px;margin:16px 0}h2{font-size:clamp(24px,4vw,34px);line-height:1.2}h3{font-size:20px;line-height:1.3}p{color:var(--muted)}.hero p{color:#d1e9d9;max-width:590px;margin-bottom:25px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:12px;background:var(--green);color:var(--surface);font-weight:700;border:0}.hero .btn{background:#e4f8e9;color:#104b35}.outline{background:var(--surface);color:var(--green);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;margin:20px 0 36px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}.card p{flex:1}.status{font-size:13px;color:var(--muted);background:var(--soft);border-radius:20px;padding:3px 10px}.crumb{font-size:14px;color:var(--muted);margin:25px 0}.lead{margin:12px 0 24px}.notice{background:var(--soft);border-radius:16px;padding:20px;margin:20px 0}input{width:100%;margin:12px 0}footer{border-top:1px solid var(--line);padding:30px 0;margin-top:30px;font-size:14px}footer p{margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:10px}.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:var(--surface);z-index:5}[hidden]{display:none!important}@media(max-width:600px){.navlinks a{display:none}.hero{margin-top:18px;border-radius:20px}.card{padding:20px}}
</style></head><body><a class="skip" href="#content">Skip to content</a><header><nav class="wrap"><a class="brand" href="#home"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#25945c" d="M24 29C9 26 13 8 40 4c0 17-5 25-16 25Z"/><path d="M23 31 34 13" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path fill="#146b48" d="M4 27q12-2 20 8 8-10 20-8v12q-12-1-20 6Q16 38 4 39Z"/></svg>EduLeaf</a><div class="navlinks"><a href="#ug">UG Education</a><a href="#about">About</a><button class="iconbtn" id="theme" aria-label="Switch theme">◐</button></div></nav></header><main class="wrap" id="content" tabindex="-1"></main><footer><div class="wrap"><strong>EduLeaf · Learn. Grow. Succeed.</strong><p>Independent educational resource platform. Not affiliated with any university or board.</p><div class="actions"><a href="#home">Home</a><a href="#about">About</a><a href="https://www.uok.edu.in/" target="_blank" rel="noopener">Official KU website ↗</a></div><p>© <span id="year"></span> EduLeaf</p></div></footer>
<script>
'use strict';
const portal='https://egov.uok.edu.in/eservices/syllabus/prelogin/course.aspx?coursetype=UGNEP';
const subjects=`Accounting & Taxation|Fundamentals of Accounting
Anthropology|Introduction to Anthropology
Arabic Literature|Elementary Course in Arabic
Biochemistry|Biochemistry

Fazila|Interpretation of Quran & Sciences of Revelation-I
Commerce (Finance)|Indian Financial System

Gender Studies|Understanding Gender
Geography|Physical Geography
Geo-Informatics|Computers and Geo-Informatics

History|History of Ancient India

Kashmiri Literature|Kashmiri Literature

Mass Communication & Multimedia Production|Introduction to Journalism
Commerce (Management)|Principles and Practice of Management
Theory of Matrices|Theory of Matrices

Zoology|Introduction to Systematics & Non-Chordates`.split('\n').map(line=>{let [name,title]=line.split('|');return {name,title,id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'')}});
const main=document.getElementById('content');const btn=(label,url,external=false)=>`<a class="btn outline" href="${url}" ${external?'target="_blank" rel="noopener noreferrer"':''}>${label}</a>`;const card=(title,desc,action='',status='')=>`<article class="card">${status?`<span class="status">${status}</span>`:''}<h3>${title}</h3><p>${desc}</p>${action}</article>`;const grid=x=>`<div class="grid">${x}</div>`;const crumb=x=>`<div class="crumb"><a href="#home">Home</a> / ${x}</div>`;const ku='<a href="#ug">UG</a> / <a href="#ku">KU</a>';const categories=['Major','Minor','MDC','AEC','SEC','VAC'];let generation=0;
function route(){const token=++generation;let [page,n,id]=location.hash.slice(1).split('/');n=/^[1-8]$/.test(n||'')?n:'1';let html='';switch(page){case 'ug':html=crumb('UG Education')+'<h1>UG Education</h1><p class="lead">Choose your university.</p>'+grid(card('University of Kashmir','Undergraduate NEP syllabus resources.',btn('Explore university →','#ku'))+card('More universities','Additional institutions will be added.','','Coming soon'));break;case 'ku':html=crumb(ku)+'<h1>University of Kashmir</h1><p class="lead">Choose your semester.</p>'+grid(Array.from({length:8},(_,i)=>card('Semester '+(i+1),'Syllabus resources',btn('Explore syllabus →','#syllabus/'+(i+1)))).join(''));break;case 'syllabus':html=crumb(ku+' / Syllabus')+`<h1>Semester ${n} syllabus</h1><label>Semester <select id="semester">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${n==i+1?'selected':''}>Semester ${i+1}</option>`).join('')}</select></label><div class="notice">Batch 2026 · Semester 1 Major catalogue. Other categories remain available through the official portal.</div><h2>Course categories</h2>`+grid(categories.map(c=>card(c,c==='Major'&&n==='1'?'54 subjects · Batch 2026':'Official syllabus access',c==='Major'&&n==='1'?btn('Explore subjects →','#major/1'):btn('Open KU portal ↗',portal,true))).join(''));break;case 'major':html=crumb(ku+' / <a href="#syllabus/1">Semester 1</a> / Major')+'<div class="eyebrow">Batch 2026 · Semester 1</div><h1>Major subjects</h1><label for="search">Search subjects or syllabus titles</label><input id="search" type="search" placeholder="e.g. Computer Applications" autocomplete="off"><p id="count" aria-live="polite"></p><div class="grid" id="results"></div>';break;case 'subject':{const s=subjects.find(x=>x.id===id);if(!s){location.hash='major/1';return}html=crumb(ku+' / <a href="#major/1">Major subjects</a>')+'<div class="eyebrow">Semester 1 · Major · Batch 2026</div><h1>'+s.name+'</h1><p class="lead">'+s.title+'</p>'+grid(card('Official syllabus',s.title,'<div id="pdf" aria-live="polite">Checking PDF availability…</div>')+card('Study notes','Materials will be added.','','Coming soon')+card('Previous year papers','Question papers will be added.','','Coming soon'));break}case 'about':html=crumb('About')+'<h1>About EduLeaf</h1><p class="lead">EduLeaf is an independent student resource platform, not affiliated with the University of Kashmir or any education board.</p>'+btn('Official KU portal ↗',portal,true);break;default:html='<div class="hero"><div class="eyebrow">Learn. Grow. Succeed.</div><h1>Knowledge for every step of your journey.</h1><p>An independent academic library, built to make educational resources easier to find and access.</p><a class="btn" href="#ug">Explore UG resources →</a></div><h2>Explore education</h2>'+grid(card('UG Education','University syllabuses and academic resources.',btn('Explore →','#ug'))+card('School Education','Class-wise resources.','','Coming soon')+card('More resources','Study notes and question papers.','','Coming soon'))+'<h2>Featured collection</h2>'+grid(card('University of Kashmir','Explore undergraduate NEP syllabus resources.',btn('View collection →','#ku')));}
main.innerHTML=html;document.title=(main.querySelector('h1')?.textContent||'Learn. Grow. Succeed.')+' | EduLeaf';window.scrollTo(0,0);if(page==='syllabus')document.getElementById('semester').onchange=e=>location.hash='syllabus/'+e.target.value;if(page==='major'){const search=document.getElementById('search');function render(){const q=search.value.trim().toLowerCase();const found=subjects.filter(s=>(s.name+' '+s.title).toLowerCase().includes(q));document.getElementById('count').textContent=found.length+' of '+subjects.length+' subjects';document.getElementById('results').innerHTML=found.map(s=>card(s.name,s.title,btn('View resources →','#subject/1/'+s.id))).join('')||'<p>No matching subjects.</p>'}search.addEventListener('input',render);render()}if(page==='subject'){const path='syllabus/semester-1/major/'+id+'.pdf';const show=async()=>{let available=false;try{const r=await fetch(path,{method:'HEAD',cache:'no-cache'});available=r.ok&&/application\/pdf/i.test(r.headers.get('content-type')||'')}catch(e){}if(token!==generation)return;document.getElementById('pdf').innerHTML=available?`<div class="actions"><a class="btn" href="${path}" target="_blank" rel="noopener">View PDF ↗</a><a class="btn outline" href="${path}" download>Download PDF</a></div>`:'<span class="status">PDF not available yet</span>'};show()}}
const theme=document.getElementById('theme');function applyTheme(v){document.documentElement.dataset.theme=v;theme.textContent=v==='dark'?'☀':'◐';theme.setAttribute('aria-label',v==='dark'?'Switch to light mode':'Switch to dark mode')}let saved;try{saved=localStorage.getItem('eduleaf-theme')}catch(e){}applyTheme(saved==='dark'||saved==='light'?saved:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');theme.onclick=()=>{const v=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(v);try{localStorage.setItem('eduleaf-theme',v)}catch(e){}};document.getElementById('year').textContent=new Date().getFullYear();window.addEventListener('hashchange',route);route();
</script></body></html>
