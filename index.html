<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146b48"><title>EduLeaf | Learn. Grow. Succeed.</title><style>
:root{color-scheme:light;--bg:#f7faf8;--surface:#fff;--ink:#17332a;--muted:#586c63;--line:#dce7df;--green:#146b48;--soft:#e7f4eb}html[data-theme=dark]{color-scheme:dark;--bg:#101b16;--surface:#182820;--ink:#e8f5ec;--muted:#afc5b7;--line:#354b3e;--green:#8de0ad;--soft:#203b2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}a{color:var(--green);text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #49a86f;outline-offset:3px}.wrap{width:min(1120px,92%);margin:auto}header,footer{background:var(--surface);border-bottom:1px solid var(--line)}nav{display:flex;align-items:center;justify-content:space-between;min-height:76px;gap:12px}.brand{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:800;color:var(--ink);letter-spacing:-1px}.brand svg{width:40px;height:40px}.navlinks{display:flex;align-items:center;gap:20px}.iconbtn,input,select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px}.hero{margin:30px 0 42px;padding:clamp(28px,6vw,76px);background:#104b35;color:white;border-radius:28px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;text-transform:uppercase;color:var(--green)}.hero .eyebrow{color:#a7e7bd}h1,h2,h3,p{margin:0}h1{font-size:clamp(32px,6vw,60px);line-height:1.1;letter-spacing:-1.5px;margin:16px 0}h2{font-size:clamp(24px,4vw,34px);line-height:1.2}h3{font-size:20px;line-height:1.3}p{color:var(--muted)}.hero p{color:#d1e9d9;max-width:590px;margin-bottom:25px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:12px;background:var(--green);color:var(--surface);font-weight:700;border:0}.hero .btn{background:#e4f8e9;color:#104b35}.outline{background:var(--surface);color:var(--green);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;margin:20px 0 36px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}.card p{flex:1}.status{font-size:13px;color:var(--muted);background:var(--soft);border-radius:20px;padding:3px 10px}.crumb{font-size:14px;color:var(--muted);margin:25px 0}.lead{margin:12px 0 24px}.notice{background:var(--soft);border-radius:16px;padding:20px;margin:20px 0}input{width:100%;margin:12px 0}footer{border-top:1px solid var(--line);padding:30px 0;margin-top:30px;font-size:14px}footer p{margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:10px}.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:var(--surface);z-index:5}[hidden]{display:none!important}@media(max-width:600px){.navlinks a{display:none}.hero{margin-top:18px;border-radius:20px}.card{padding:20px}}
main.enter{animation:enter .24s ease-out} @keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}} .btn,.iconbtn{transition:transform .15s,background .2s,color .2s}.btn:active,.iconbtn:active{transform:scale(.97)} body,header,footer,.card{transition:background .2s,color .2s} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}} </style></head><body><a class="skip" href="#content">Skip to content</a><header><nav class="wrap"><a class="brand" href="#home"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#25945c" d="M24 29C9 26 13 8 40 4c0 17-5 25-16 25Z"/><path d="M23 31 34 13" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path fill="#146b48" d="M4 27q12-2 20 8 8-10 20-8v12q-12-1-20 6Q16 38 4 39Z"/></svg>EduLeaf</a><div class="navlinks"><a href="#ug">UG Education</a><a href="#about">About</a><button class="iconbtn" id="theme" aria-label="Switch theme">◐</button></div></nav></header><main class="wrap" id="content" tabindex="-1"></main><footer><div class="wrap"><strong>EduLeaf · Learn. Grow. Succeed.</strong><p>Independent educational resource platform. Not affiliated with any university or board.</p><div class="actions"><a href="#home">Home</a><a href="#about">About</a><a href="https://www.uok.edu.in/" target="_blank" rel="noopener">Official KU website ↗</a></div><p>© <span id="year"></span> EduLeaf</p></div></footer>
<script>
'use strict';const portal='https://egov.uok.edu.in/eservices/syllabus/prelogin/course.aspx?coursetype=UGNEP';
const main=document.getElementById('content');const btn=(label,url,external=false)=>`<a class="btn outline" href="${url}" ${external?'target="_blank" rel="noopener noreferrer"':''}>${label}</a>`;const card=(title,desc,action='',status='')=>`<article class="card">${status?`<span class="status">${status}</span>`:''}<h3>${title}</h3><p>${desc}</p>${action}</article>`;const grid=x=>`<div class="grid">${x}</div>`;const crumb=x=>`<div class="crumb"><a href="#home">Home</a> / ${x}</div>`;const ku='<a href="#ug">UG</a> / <a href="#ku">KU</a>';const categories=['Major','Minor','MDC','AEC','SEC','VAC'];let generation=0;

let data=[],error=false,ready=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const group=x=>({MAJOR:'Major',MINOR:'Minor',MULTIDISCIPLINARY:'MDC',ABILITY:'AEC',SKILL:'SEC',VALUE:'VAC'}[x.category.split(' ')[0]]||'Other');
const sem=x=>x.semester.startsWith('Ist')?'1':x.semester.match(/^\d+/)?.[0];
const batches=['2026','2025','2024'];
function route(){const token=++generation;let [page,b,n,c,id]=location.hash.slice(1).split('/');if(!batches.includes(b))b='2026';if(!/^[1-8]$/.test(n||''))n='1';let html='';const base='#syllabus/'+b+'/'+n;const cat='#category/'+b+'/'+n+'/'+c;const bc=ku+' / <a href="#ku">Batch '+b+'</a> / <a href="'+base+'">Semester '+n+'</a>';const rows=data.filter(x=>x.batch===b&&sem(x)===n);const list=rows.filter(x=>group(x)===c);const loading=!ready?'<div class="notice">'+(error?'Could not load course data. Refresh to retry.':'Loading syllabus catalogue…')+'</div>':'';
if(page==='ku')html=crumb(ku)+'<h1>University of Kashmir</h1><p class="lead">Choose your batch.</p>'+grid(batches.map(y=>card('Batch '+y,'Undergraduate syllabus',btn('Explore →','#batch/'+y))).join(''));
else if(page==='batch')html=crumb(ku)+'<h1>Batch '+b+'</h1>'+grid(Array.from({length:8},(_,i)=>card('Semester '+(i+1),'Syllabus resources',btn('Explore →','#syllabus/'+b+'/'+(i+1)))).join(''));
else if(page==='syllabus')html=crumb(bc)+'<h1>Semester '+n+' syllabus</h1>'+loading+grid([...new Set([...categories,...rows.map(group)])].map(k=>card(k,rows.filter(x=>group(x)===k).length+' course records',btn('Explore →','#category/'+b+'/'+n+'/'+k))).join(''));
else if(page==='category')html=crumb(bc)+'<h1>'+esc(c)+' subjects</h1>'+loading+'<label for="search">Search name, code or course type</label><input id="search" type="search" placeholder="Search subjects"><p id="count" aria-live="polite"></p><div class="grid" id="results"></div>';
else if(page==='subject'){const x=data[Number(id)];if(!x||x.batch!==b||sem(x)!==n||group(x)!==c)html=crumb(bc)+loading+'<p>Course unavailable.</p>'+btn('Back to subjects',cat);else html=crumb(bc+' / <a href="'+cat+'">'+esc(c)+'</a>')+'<h1>'+esc(x.name)+'</h1><p class="lead">'+esc(x.code)+' · '+esc(x.remarks)+'</p><p>'+esc(x.category)+'</p>'+grid(card('Syllabus','University syllabus PDF','<div id="pdf">Checking local PDF…</div>')+card('Study notes','Materials will be added.','','Coming soon')+card('Previous year papers','Materials will be added.','','Coming soon'));}
else if(page==='major'){location.replace('#category/2026/1/Major');return}
else if(page==='ug')html=crumb('UG Education')+'<h1>UG Education</h1>'+grid(card('University of Kashmir','Undergraduate NEP syllabus resources.',btn('Explore university →','#ku')));
else if(page==='about')html=crumb('About')+'<h1>About EduLeaf</h1><p class="lead">Independent student resource platform. Catalogue sourced from kashmiruniversitysyllabus.com; syllabus links point to University of Kashmir. Records have not been independently verified.</p>'+btn('Official KU portal ↗',portal,true);
else html='<div class="hero"><div class="eyebrow">Learn. Grow. Succeed.</div><h1>Knowledge for every step of your journey.</h1><p>An independent academic library, built to make educational resources easier to find and access.</p><a class="btn" href="#ug">Explore UG resources →</a></div><h2>Explore education</h2>'+grid(card('UG Education','University syllabuses and academic resources.',btn('Explore →','#ug'))+card('School Education','Class-wise resources.','','Coming soon')+card('More resources','Study notes and question papers.','','Coming soon'))+'<h2>Featured collection</h2>'+grid(card('University of Kashmir','Explore undergraduate NEP syllabus resources.',btn('View collection →','#ku')));
main.innerHTML=html;main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter');document.title=(main.querySelector('h1')?.textContent||'Learn. Grow. Succeed.')+' | EduLeaf';window.scrollTo(0,0);
if(page==='category'){const search=document.getElementById('search');const render=()=>{const q=search.value.trim().toLowerCase();const found=list.filter(x=>[x.name,x.code,x.category].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=found.length+' of '+list.length+' courses';document.getElementById('results').innerHTML=found.map(x=>card(esc(x.name),esc(x.code)+' · '+esc(x.remarks)+'<br>'+esc(x.category),btn('View resources →','#subject/'+b+'/'+n+'/'+c+'/'+data.indexOf(x)))).join('')||'<p>No matching courses.</p>'};search.oninput=render;render()}
if(page==='subject'&&document.getElementById('pdf')){const x=data[Number(id)];(async()=>{let local=false;try{const r=await fetch(x.pdf,{method:'HEAD'});local=r.ok&&/application\/pdf/i.test(r.headers.get('content-type')||'')}catch{}if(token!==generation)return;const el=document.getElementById('pdf');el.innerHTML=local?btn('View PDF ↗',esc(x.pdf),true)+' <a class="btn outline" download href="'+esc(x.pdf)+'">Download PDF</a>':'<p>Local PDF not uploaded yet.</p>'+btn('Open official PDF ↗',esc(x.link),true)})()}}
fetch('courses.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{if(!Array.isArray(v))throw Error();data=v;ready=true;route()}).catch(()=>{error=true;route()});
const theme=document.getElementById('theme');function applyTheme(v){document.documentElement.dataset.theme=v;theme.textContent=v==='dark'?'☀':'◐';theme.setAttribute('aria-label',v==='dark'?'Switch to light mode':'Switch to dark mode')}let saved;try{saved=localStorage.getItem('eduleaf-theme')}catch(e){}applyTheme(saved==='dark'||saved==='light'?saved:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');theme.onclick=()=>{const v=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(v);try{localStorage.setItem('eduleaf-theme',v)}catch(e){}};document.getElementById('year').textContent=new Date().getFullYear();window.addEventListener('hashchange',route);route();
</script></body></html>
